name: Aggiornamento Automatico Offerte

on:
  schedule:
    - cron: '0 3 * * *'  # Esegue ogni notte alle 03:00 UTC
  workflow_dispatch:      # Ti permette di avviarlo anche manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica codice
      uses: actions/checkout@v3

    - name: Configura Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Installa dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Esegui Scraper
      run: python scraper.py

    - name: Salva modifiche su GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add offerte.json
        git commit -m "Aggiornamento automatico offerte" || exit 0
        git push
