<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Mia Spesa Smart</title>
  <!-- Widget Netlify Identity per gestione inviti e login -->
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding-top: 30px;
      padding-bottom: 20px;
      background-color: #08080c;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    .glow-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
      animation: float 12s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 100%);
      top: -50px;
      left: -80px;
    }

    .blob-2 {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, #8a2be2 0%, #4a00e0 100%);
      bottom: -80px;
      right: -80px;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(18, 18, 26, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      width: 92%;
      max-width: 400px;
      margin-bottom: 20px;
    }

    /* Schermata di blocco */
    #lockScreen {
      text-align: center;
      padding: 30px 10px;
    }

    #lockScreen h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    #lockScreen p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 25px;
    }

    .auth-btn {
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
    }

    #appContent {
      display: none;
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 22px;
      color: #ffffff;
      text-align: center;
    }

    /* Input & Autocompletamento */
    .input-wrapper {
      position: relative;
      margin-bottom: 15px;
    }

    .input-box {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
    }

    button.add-btn {
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    .suggestions-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 50px;
      background: rgba(24, 24, 35, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 10;
      margin-top: 5px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
    }

    .suggestion-item {
      padding: 10px 12px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .suggestion-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    ul { list-style: none; padding: 0; margin: 0; }

    /* Elementi Lista Compatti con Logo */
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    li.completato {
      opacity: 0.35;
    }

    li.completato .item-text {
      text-decoration: line-through;
    }

    .item-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 82%;
    }

    .item-text {
      font-size: 14px;
      color: #ffffff;
      word-break: break-word;
    }

    /* Stile per i loghi dei negozi */
    .store-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      margin-top: 2px;
    }

    .logo-img {
      height: 16px;
      width: auto;
      object-fit: contain;
      border-radius: 2px;
      vertical-align: middle;
    }

    .store-price {
      color: #4ade80;
      font-weight: bold;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff4d4d;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .clear-btn {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background: rgba(255, 59, 48, 0.15);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.3);
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Crediti in basso a destra */
    .footer-credits {
      width: 100%;
      max-width: 400px;
      text-align: right;
      padding-right: 15px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 1;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <div class="container">
    
    <!-- SCHERMATA DI BLOCCO -->
    <div id="lockScreen">
      🔒 <h2>Area Riservata</h2>
      <p>Questa applicazione è accessibile solo su invito.</p>
      <button class="auth-btn" onclick="openLogin()">Accedi con il tuo Invito</button>
    </div>

    <!-- CONTENUTO APP -->
    <div id="appContent">
      <div class="user-header">
        <span id="userEmail"></span>
        <button class="logout-btn" onclick="logout()">Esci</button>
      </div>

      <h1>🛒 Lista della Spesa</h1>

      <!-- Input con Autocompletamento Anteprima -->
      <div class="input-wrapper">
        <div class="input-box">
          <input type="text" id="elementoInput" placeholder="Aggiungi oggetto..." oninput="gestisciSuggerimenti()">
          <button class="add-btn" onclick="aggiungiElemento()">+</button>
        </div>
        <div id="suggestionsBox" class="suggestions-box"></div>
      </div>

      <!-- Lista degli elementi -->
      <ul id="listaSpesa"></ul>

      <button id="btnSvuota" class="clear-btn" onclick="svuotaLista()" style="display: none;">🗑️ Svuota Lista</button>
    </div>

  </div>

  <!-- CREDITI IN BASSO A DESTRA -->
  <div class="footer-credits">
    Created by Gian Luca Trabucco
  </div>

  <script>
    let elementi = JSON.parse(localStorage.getItem("spesa")) || [];
    let datiOfferte = [];

    // URL dei loghi ufficiali
    const LOGHI_NEGOZI = {
      'Lidl': 'https://upload.wikimedia.org/wikipedia/commons/9/91/Lidl-Logo.svg',
      'Eurospin': 'https://upload.wikimedia.org/wikipedia/commons/d/d3/Eurospin_logo.svg'
    };

    document.addEventListener("DOMContentLoaded", function() {
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => updateAuthUI(user));
        window.netlifyIdentity.on("login", user => { window.netlifyIdentity.close(); updateAuthUI(user); });
        window.netlifyIdentity.on("logout", () => updateAuthUI(null));
      }

      fetch('offerte.json')
        .then(res => res.json())
        .then(data => {
          datiOfferte = Object.values(data);
          mostraLista();
        })
        .catch(err => console.error("Errore caricamento offerte:", err));

      document.getElementById("elementoInput").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          nascondiSuggerimenti();
          aggiungiElemento();
        }
      });
    });

    function updateAuthUI(user) {
      const lockScreen = document.getElementById("lockScreen");
      const appContent = document.getElementById("appContent");
      const userEmail = document.getElementById("userEmail");

      if (user) {
        lockScreen.style.display = "none";
        appContent.style.display = "block";
        userEmail.innerText = user.email;
        mostraLista();
      } else {
        lockScreen.style.display = "block";
        appContent.style.display = "none";
      }
    }

    function openLogin() { if (window.netlifyIdentity) window.netlifyIdentity.open(); }
    function logout() { if (window.netlifyIdentity) window.netlifyIdentity.logout(); }

    function salvaInMemoria() { localStorage.setItem("spesa", JSON.stringify(elementi)); }

    function getLogoHTML(negozio) {
      if (LOGHI_NEGOZI[negozio]) {
        return `<img src="${LOGHI_NEGOZI[negozio]}" alt="${negozio}" class="logo-img">`;
      }
      return `<span>📍 ${negozio}</span>`;
    }

    /* Autocompletamento Anteprima */
    function gestisciSuggerimenti() {
      const input = document.getElementById("elementoInput");
      const box = document.getElementById("suggestionsBox");
      const testo = input.value.toLowerCase().trim();

      if (testo.length < 2) {
        box.style.display = "none";
        return;
      }

      const trovati = datiOfferte.filter(off => (off.titolo || "").toLowerCase().includes(testo)).slice(0, 5);

      if (trovati.length === 0) {
        box.style.display = "none";
        return;
      }

      box.innerHTML = "";
      trovati.forEach(off => {
        const item = document.createElement("div");
        item.className = "suggestion-item";
        const logo = getLogoHTML(off.negozio);
        item.innerHTML = `<span style="display:flex; align-items:center; gap:6px;">${logo} ${off.titolo}</span> <span style="color:#4ade80; font-weight:bold;">${off.prezzo}</span>`;
        
        item.onclick = function() {
          input.value = off.titolo;
          box.style.display = "none";
          aggiungiElementoConDettagli(off.titolo, off.negozio, off.prezzo);
        };
        box.appendChild(item);
      });
      box.style.display = "block";
    }

    function nascondiSuggerimenti() {
      setTimeout(() => { document.getElementById("suggestionsBox").style.display = "none"; }, 200);
    }

    /* Rendering Lista */
    function mostraLista() {
      const ul = document.getElementById("listaSpesa");
      const btnSvuota = document.getElementById("btnSvuota");
      if (!ul) return;
      
      ul.innerHTML = "";
      btnSvuota.style.display = elementi.length > 0 ? "block" : "none";

      elementi.forEach((item, index) => {
        const li = document.createElement("li");
        if (item.comprato) li.classList.add("completato");

        li.onclick = function() {
          elementi[index].comprato = !elementi[index].comprato;
          salvaInMemoria();
          mostraLista();
        };

        // Gestione logo e dettagli offerta
        let tagNegozioHTML = "";
        if (item.negozio) {
          tagNegozioHTML = `<div class="store-tag">${getLogoHTML(item.negozio)} <span class="store-price">${item.prezzo || ''}</span></div>`;
        } else {
          const parola = item.testo.toLowerCase().trim();
          const off = datiOfferte.find(o => (o.titolo || "").toLowerCase().includes(parola));
          if (off) {
            tagNegozioHTML = `<div class="store-tag">${getLogoHTML(off.negozio)} <span class="store-price">${off.prezzo}</span></div>`;
          }
        }

        li.innerHTML = `
          <div class="item-content">
            <span class="item-text">${item.testo}</span>
            ${tagNegozioHTML}
          </div>
          <button class="delete-btn" onclick="eliminaElemento(event, ${index})">✕</button>
        `;
        ul.appendChild(li);
      });
    }

    function aggiungiElemento() {
      const input = document.getElementById("elementoInput");
      const testo = input.value.trim();
      if (testo === "") return;

      elementi.push({ testo: testo, comprato: false });
      salvaInMemoria();
      mostraLista();
      input.value = "";
    }

    function aggiungiElementoConDettagli(testo, negozio, prezzo) {
      elementi.push({ testo: testo, negozio: negozio, prezzo: prezzo, comprato: false });
      salvaInMemoria();
      mostraLista();
      document.getElementById("elementoInput").value = "";
    }

    function eliminaElemento(event, index) {
      event.stopPropagation();
      elementi.splice(index, 1);
      salvaInMemoria();
      mostraLista();
    }

    function svuotaLista() {
      if (elementi.length === 0) return;
      if (confirm("Sei sicuro di voler cancellare tutta la lista?")) {
        elementi = [];
        salvaInMemoria();
        mostraLista();
      }
    }
  </script>

</body>
</html>
