<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Mia Spesa Smart</title>
  <!-- Widget Netlify Identity per gestione inviti e login -->
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Firebase SDK per la sincronizzazione in tempo reale -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding-top: 30px;
      padding-bottom: 20px;
      background-color: #08080c;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    .glow-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
      animation: float 12s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 100%);
      top: -50px;
      left: -80px;
    }

    .blob-2 {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, #8a2be2 0%, #4a00e0 100%);
      bottom: -80px;
      right: -80px;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(18, 18, 26, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      width: 92%;
      max-width: 400px;
      margin-bottom: 20px;
    }

    /* Schermata di blocco */
    #lockScreen {
      text-align: center;
      padding: 30px 10px;
    }

    #lockScreen h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    #lockScreen p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 25px;
    }

    .auth-btn {
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
    }

    #appContent {
      display: none;
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 22px;
      color: #ffffff;
      text-align: center;
    }

    /* Selettore Stanza / Lista Condivisa */
    .room-selector {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .room-selector label {
      color: rgba(255, 255, 255, 0.7);
    }

    .room-box {
      display: flex;
      gap: 6px;
    }

    .room-box input {
      flex: 1;
      padding: 8px 10px;
      font-size: 13px;
    }

    .room-btn {
      background: rgba(0, 210, 255, 0.2);
      border: 1px solid rgba(0, 210, 255, 0.4);
      color: #00d2ff;
      padding: 0 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }

    /* Input & Autocompletamento */
    .input-wrapper {
      position: relative;
      margin-bottom: 15px;
    }

    .input-box {
      display: flex;
      gap: 8px;
    }

    input, select {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
      padding: 12px 10px;
    }

    select option {
      background: #181824;
      color: #ffffff;
    }

    #quantitaInput {
      width: 55px;
      text-align: center;
    }

    #unitaInput {
      width: 70px;
    }

    /* Pannello Pulsanti Quantità Rapidi */
    .quick-qty-panel {
      display: none;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .quick-qty-btn {
      background: rgba(0, 210, 255, 0.15);
      border: 1px solid rgba(0, 210, 255, 0.4);
      color: #00d2ff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    button.add-btn {
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    .suggestions-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 50px;
      background: rgba(24, 24, 35, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 10;
      margin-top: 5px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
    }

    .suggestion-item {
      padding: 10px 12px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .suggestion-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    ul { list-style: none; padding: 0; margin: 0; }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    li.completato {
      opacity: 0.35;
    }

    li.completato .item-text {
      text-decoration: line-through;
    }

    .item-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 65%;
    }

    .item-text {
      font-size: 14px;
      color: #ffffff;
      word-break: break-word;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .offer-alert-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .store-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      margin-top: 2px;
    }

    .store-price {
      color: #4ade80;
      font-weight: bold;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff4d4d;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
    }

    .clear-btn {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background: rgba(255, 59, 48, 0.15);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.3);
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .whatsapp-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: rgba(37, 211, 102, 0.15);
      color: #25d366;
      border: 1px solid rgba(37, 211, 102, 0.3);
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .whatsapp-btn:hover {
      background: rgba(37, 211, 102, 0.25);
    }

    /* Modal Offerte */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background: #181824;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 20px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      color: #ffffff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      color: #f59e0b;
    }

    .close-modal-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 18px;
      cursor: pointer;
    }

    .modal-offers-list {
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-offer-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-credits {
      width: 100%;
      max-width: 400px;
      text-align: right;
      padding-right: 15px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 1;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <div class="container">
    
    <!-- SCHERMATA DI BLOCCO -->
    <div id="lockScreen">
      🔒 <h2>Area Riservata</h2>
      <p>Questa applicazione è accessibile solo su invito.</p>
      <button class="auth-btn" onclick="openLogin()">Accedi con il tuo Invito</button>
    </div>

    <!-- CONTENUTO APP -->
    <div id="appContent">
      <div class="user-header">
        <span id="userEmail"></span>
        <button class="logout-btn" onclick="logout()">Esci</button>
      </div>

      <h1>🛒 Lista della Spesa</h1>

      <!-- Selettore Lista Privata o Condivisa (Stanza) -->
      <div class="room-selector">
        <label>🔑 Nome Stanza / Lista Condivisa:</label>
        <div class="room-box">
          <input type="text" id="roomInput" placeholder="Es: casa-rossi">
          <button class="room-btn" onclick="cambiaStanza()">Collega</button>
        </div>
      </div>

      <!-- Input con Autocompletamento e Quantità -->
      <div class="input-wrapper">
        <div class="input-box">
          <input type="number" id="quantitaInput" value="1" min="1" placeholder="Qtà">
          <select id="unitaInput">
            <option value="pz">pz</option>
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="L">L</option>
          </select>
          <input type="text" id="elementoInput" placeholder="Aggiungi oggetto..." oninput="gestisciInputDigitazione()">
          <button class="add-btn" onclick="aggiungiElemento()">+</button>
        </div>
        
        <div id="quickQtyPanel" class="quick-qty-panel">
          <span style="font-size: 11px; color: rgba(255,255,255,0.5); align-self: center; margin-right: 2px;">Qtà rapida:</span>
          <button class="quick-qty-btn" onclick="impostaQuantitaRapida(1, 'pz')">1</button>
          <button class="quick-qty-btn" onclick="impostaQuantitaRapida(2, 'pz')">2</button>
          <button class="quick-qty-btn" onclick="impostaQuantitaRapida(3, 'pz')">3</button>
          <button class="quick-qty-btn" onclick="impostaQuantitaRapida(5, 'pz')">5</button>
          <button class="quick-qty-btn" onclick="impostaQuantitaRapida(500, 'g')">500g</button>
          <button class="quick-qty-btn" onclick="impostaQuantitaRapida(1, 'kg')">1kg</button>
        </div>

        <div id="suggestionsBox" class="suggestions-box"></div>
      </div>

      <!-- Lista degli elementi -->
      <ul id="listaSpesa"></ul>

      <button id="btnSvuota" class="clear-btn" onclick="svuotaLista()" style="display: none;">🗑️ Svuota Lista</button>
      <button class="whatsapp-btn" onclick="condividiWhatsApp()">💬 Condividi su WhatsApp</button>
    </div>

  </div>

  <!-- MODAL OFFERTE -->
  <div id="modalOfferte" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">🏷️ Offerte trovate</h3>
        <button class="close-modal-btn" onclick="chiudiModal()">✕</button>
      </div>
      <div id="modalOffersList" class="modal-offers-list"></div>
    </div>
  </div>

  <!-- CREDITI IN BASSO A DESTRA -->
  <div class="footer-credits">
    Created by Gian Luca Trabucco
  </div>

  <script>
    // CONFIGURAZIONE FIREBASE AGGIORNATA
    const firebaseConfig = {
      apiKey: "AIzaSyCvyxezvjGgzqCQVV6bvP9umQ7KvLtDo5c",
      authDomain: "app-spesa-4be95.firebaseapp.com",
      databaseURL: "https://app-spesa-4be95-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "app-spesa-4be95",
      storageBucket: "app-spesa-4be95.firebasestorage.app",
      messagingSenderId: "452227653225",
      appId: "1:452227653225:web:f6591ddf4cfc1963e9ccf8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let elementi = [];
    let datiOfferte = [];
    let timerDigitazione = null;
    let databaseRef = null;
    let stanzaCorrente = "";

    const LOGHI_NEGOZI = {
      'Lidl': '<span style="background:#0050aa; color:#fff000; font-weight:900; padding:2px 6px; border-radius:4px; border:1px solid #d01010; font-size:10px;">LIDL</span>',
      'Eurospin': '<span style="background:#003399; color:#ffffff; font-weight:bold; padding:2px 6px; border-radius:4px; font-size:10px;"><span style="color:#ffcc00;">★</span> EUROSPIN</span>'
    };

    document.addEventListener("DOMContentLoaded", function() {
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => updateAuthUI(user));
        window.netlifyIdentity.on("login", user => { window.netlifyIdentity.close(); updateAuthUI(user); });
        window.netlifyIdentity.on("logout", () => updateAuthUI(null));
      }

      fetch('offerte.json')
        .then(res => res.json())
        .then(data => {
          datiOfferte = Object.values(data);
          mostraLista();
        })
        .catch(err => console.error("Errore caricamento offerte:", err));

      document.getElementById("elementoInput").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          event.preventDefault();
          nascondiSuggerimenti();
          nascondiPannelloRapido();
          aggiungiElemento();
        }
      });
    });

    function updateAuthUI(user) {
      const lockScreen = document.getElementById("lockScreen");
      const appContent = document.getElementById("appContent");
      const userEmail = document.getElementById("userEmail");

      if (user) {
        lockScreen.style.display = "none";
        appContent.style.display = "block";
        userEmail.innerText = user.email;
        
        const safeEmail = user.email.replace(/[.#$[\]]/g, "_");
        document.getElementById("roomInput").value = safeEmail;
        impostaStanzaCloud(safeEmail);
      } else {
        lockScreen.style.display = "block";
        appContent.style.display = "none";
        if (databaseRef) databaseRef.off();
      }
    }

    function impostaStanzaCloud(nomeStanza) {
      if (databaseRef) databaseRef.off(); 
      stanzaCorrente = nomeStanza.trim().replace(/[.#$[\]]/g, "_");
      
      databaseRef = db.ref('liste/' + stanzaCorrente);

      databaseRef.on('value', (snapshot) => {
        const data = snapshot.val();
        elementi = data ? data : [];
        mostraLista();
      });
    }

    function cambiaStanza() {
      const nuovoNome = document.getElementById("roomInput").value.trim();
      if (!nuovoNome) {
        alert("Inserisci un nome valido per la stanza!");
        return;
      }
      impostaStanzaCloud(nuovoNome);
    }

    function openLogin() { if (window.netlifyIdentity) window.netlifyIdentity.open(); }
    function logout() { if (window.netlifyIdentity) window.netlifyIdentity.logout(); }

    function salvaInMemoria() {
      if (databaseRef) {
        databaseRef.set(elementi);
      }
    }

    function getLogoHTML(negozio) {
      return LOGHI_NEGOZI[negozio] || `<span>📍 ${negozio}</span>`;
    }

    function gestisciInputDigitazione() {
      gestisciSuggerimenti();
      const input = document.getElementById("elementoInput");
      const pannello = document.getElementById("quickQtyPanel");

      pannello.style.display = "none";
      clearTimeout(timerDigitazione);

      if (input.value.trim().length > 0) {
        timerDigitazione = setTimeout(() => {
          if (input.value.trim().length > 0) {
            pannello.style.display = "flex";
          }
        }, 700);
      }
    }

    function nascondiPannelloRapido() {
      document.getElementById("quickQtyPanel").style.display = "none";
    }

    function impostaQuantitaRapida(valore, unita) {
      document.getElementById("quantitaInput").value = valore;
      document.getElementById("unitaInput").value = unita;
      nascondiPannelloRapido();
    }

    function gestisciSuggerimenti() {
      const input = document.getElementById("elementoInput");
      const box = document.getElementById("suggestionsBox");
      const testo = input.value.toLowerCase().trim();

      if (testo.length < 2) {
        box.style.display = "none";
        return;
      }

      const trovati = datiOfferte.filter(off => (off.titolo || "").toLowerCase().includes(testo)).slice(0, 5);

      if (trovati.length === 0) {
        box.style.display = "none";
        return;
      }

      box.innerHTML = "";
      trovati.forEach(off => {
        const item = document.createElement("div");
        item.className = "suggestion-item";
        const logo = getLogoHTML(off.negozio);
        item.innerHTML = `<span style="display:flex; align-items:center; gap:6px;">${logo} ${off.titolo}</span> <span style="color:#4ade80; font-weight:bold;">${off.prezzo}</span>`;
        
        item.onclick = function() {
          input.value = off.titolo;
          box.style.display = "none";
          nascondiPannelloRapido();
          aggiungiElementoConDettagli(off.titolo, off.negozio, off.prezzo);
        };
        box.appendChild(item);
      });
      box.style.display = "block";
    }

    function nascondiSuggerimenti() {
      setTimeout(() => { document.getElementById("suggestionsBox").style.display = "none"; }, 200);
    }

    function cercaOffertePerTesto(testo) {
      const parola = testo.toLowerCase().trim();
      if (!parola || parola.length < 2) return [];
      return datiOfferte.filter(off => (off.titolo || "").toLowerCase().includes(parola));
    }

    function mostraLista() {
      const ul = document.getElementById("listaSpesa");
      const btnSvuota = document.getElementById("btnSvuota");
      if (!ul) return;
      
      ul.innerHTML = "";
      btnSvuota.style.display = elementi.length > 0 ? "block" : "none";

      elementi.forEach((item, index) => {
        const li = document.createElement("li");
        if (item.comprato) li.classList.add("completato");

        li.onclick = function() {
          elementi[index].comprato = !elementi[index].comprato;
          salvaInMemoria();
          mostraLista();
        };

        let tagNegozioHTML = "";
        let offerteCorrispondenti = [];

        if (item.negozio) {
          tagNegozioHTML = `<div class="store-tag">${getLogoHTML(item.negozio)} <span class="store-price">${item.prezzo || ''}</span></div>`;
        } else {
          offerteCorrispondenti = cercaOffertePerTesto(item.testo);
        }

        let alertOffertaHTML = "";
        if (!item.negozio && offerteCorrispondenti.length > 0) {
          alertOffertaHTML = `<button class="offer-alert-btn" onclick="apriModalOfferte(event, '${item.testo.replace(/'/g, "\\'")}')">🏷️ Offerte!</button>`;
        }

        let quantitaTesto = item.quantita ? `${item.quantita} ${item.unita || ''} - ` : "";

        const itemTextSpan = document.createElement("span");
        itemTextSpan.className = "item-text";
        itemTextSpan.textContent = quantitaTesto + item.testo;

        const contentDiv = document.createElement("div");
        contentDiv.className = "item-content";
        contentDiv.appendChild(itemTextSpan);
        
        if (tagNegozioHTML) {
          const storeTagDiv = document.createElement("div");
          storeTagDiv.innerHTML = tagNegozioHTML;
          contentDiv.appendChild(storeTagDiv);
        }

        li.appendChild(contentDiv);

        const actionsDiv = document.createElement("div");
        actionsDiv.className = "item-actions";

        if (alertOffertaHTML) {
          const alertWrapper = document.createElement("div");
          alertWrapper.innerHTML = alertOffertaHTML;
          actionsDiv.appendChild(alertWrapper.firstElementChild);
        }

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.innerHTML = "✕";
        deleteBtn.onclick = function(event) { eliminaElemento(event, index); };
        actionsDiv.appendChild(deleteBtn);

        li.appendChild(actionsDiv);
        ul.appendChild(li);
      });
    }

    function apriModalOfferte(event, parolaChiave) {
      event.stopPropagation();
      const modal = document.getElementById("modalOfferte");
      const title = document.getElementById("modalTitle");
      const list = document.getElementById("modalOffersList");

      const offerte = cercaOffertePerTesto(parolaChiave);
      title.innerText = `🏷️ Offerte per "${parolaChiave}"`;
      list.innerHTML = "";

      offerte.forEach(off => {
        const div = document.createElement("div");
        div.className = "modal-offer-item";
        div.innerHTML = `
          <div>
            <div style="margin-bottom:4px;">${getLogoHTML(off.negozio)}</div>
            <strong style="font-size:13px;">${off.titolo}</strong>
          </div>
          <span class="store-price" style="font-size:14px;">${off.prezzo}</span>
        `;
        list.appendChild(div);
      });

      modal.style.display = "flex";
    }

    function chiudiModal() {
      document.getElementById("modalOfferte").style.display = "none";
    }

    function aggiungiElemento() {
      const input = document.getElementById("elementoInput");
      const quantitaInput = document.getElementById("quantitaInput");
      const unitaInput = document.getElementById("unitaInput");
      
      const testo = input.value.trim();
      const quantita = quantitaInput.value.trim() || "1";
      const unita = unitaInput.value;

      if (testo === "") return;

      elementi.push({ testo: testo, quantita: quantita, unita: unita, comprato: false });
      salvaInMemoria();
      mostraLista();
      
      input.value = "";
      quantitaInput.value = "1";
      unitaInput.value = "pz";
      nascondiPannelloRapido();
    }

    function aggiungiElementoConDettagli(testo, negozio, prezzo) {
      const quantitaInput = document.getElementById("quantitaInput");
      const unitaInput = document.getElementById("unitaInput");
      
      const quantita = quantitaInput.value.trim() || "1";
      const unita = unitaInput.value;

      elementi.push({ testo: testo, quantita: quantita, unita: unita, negozio: negozio, prezzo: prezzo, comprato: false });
      salvaInMemoria();
      mostraLista();
      
      document.getElementById("elementoInput").value = "";
      quantitaInput.value = "1";
      unitaInput.value = "pz";
      nascondiPannelloRapido();
    }

    function eliminaElemento(event, index) {
      event.stopPropagation();
      elementi.splice(index, 1);
      salvaInMemoria();
      mostraLista();
    }

    function svuotaLista() {
      if (elementi.length === 0) return;
      if (confirm("Sei sicuro di voler cancellare tutta la lista?")) {
        elementi = [];
        salvaInMemoria();
        mostraLista();
      }
    }

    function condividiWhatsApp() {
      if (elementi.length === 0) {
        alert("La lista è vuota!");
        return;
      }

      let testoMessaggio = "🛒 *Lista della Spesa (" + stanzaCorrente + ")*\n\n";
      elementi.forEach(item => {
        let stato = item.comprato ? "✅ " : "⬜ ";
        let qta = item.quantita ? `(${item.quantita} ${item.unita || ''}) ` : "";
        let negozio = item.negozio ? ` [📍 ${item.negozio} - ${item.prezzo}]` : "";
        testoMessaggio += `${stato}${qta}${item.testo}${negozio}\n`;
      });

      const urlWhatsApp = `https://api.whatsapp.com/send?text=${encodeURIComponent(testoMessaggio)}`;
      window.open(urlWhatsApp, '_blank');
    }
  </script>

</body>
</html>
