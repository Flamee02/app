<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Spesa e Offerte</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #1e293b;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    button {
      padding: 12px 20px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .item-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .btn-del {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .offerte-list {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
    }
    .offerta-tag {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 4px solid #16a34a;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 5px;
      font-size: 14px;
    }
    .offerta-tag.Eurospin {
      border-left-color: #0284c7;
      background: #f0f9ff;
    }
    .offerta-tag.Lidl {
      border-left-color: #eab308;
      background: #fefce8;
    }
    .no-offerta {
      color: #94a3b8;
      font-size: 13px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛒 Lista della Spesa Smart</h1>
    
    <div class="input-group">
      <input type="text" id="prodottoInput" placeholder="Aggiungi prodotto (es. pane, latte)...">
      <button onclick="aggiungiProdotto()">Aggiungi</button>
    </div>

    <div id="listaSpesa"></div>
  </div>

  <script>
    let offerteVolantino = [];
    let listaProdotti = [];

    // Carica le offerte scaricate dallo scraper Python
    fetch('offerte.json')
      .then(res => res.json())
      .then(data => {
        offerteVolantino = Object.values(data);
      })
      .catch(err => console.error("Errore caricamento offerte:", err));

    function aggiungiProdotto() {
      const input = document.getElementById('prodottoInput');
      const nome = input.value.trim();
      
      if (nome === "") return;

      listaProdotti.push(nome);
      input.value = "";
      aggiornaGrafica();
    }

    function rimuoviProdotto(index) {
      listaProdotti.splice(index, 1);
      aggiornaGrafica();
    }

    function aggiornaGrafica() {
      const container = document.getElementById('listaSpesa');
      container.innerHTML = "";

      listaProdotti.forEach((prodotto, index) => {
        const card = document.createElement('div');
        card.className = "item-card";

        // Cerca se il prodotto inserito corrisponde a un'offerta presente nei volantini
        const offerteTrovate = offerteVolantino.filter(off => 
          off.titolo.toLowerCase().includes(prodotto.toLowerCase())
        );

        let htmlOfferte = "";
        if (offerteTrovate.length > 0) {
          offerteTrovate.forEach(off => {
            htmlOfferte += `
              <div class="offerta-tag ${off.negozio}">
                <strong>📍 ${off.negozio}:</strong> ${off.titolo} — <span style="color: #16a34a; font-weight: bold;">${off.prezzo}</span>
              </div>
            `;
          });
        } else {
          htmlOfferte = `<div class="no-offerta">Nessuna offerta trovata questa settimana per "${prodotto}".</div>`;
        }

        card.innerHTML = `
          <div class="item-header">
            <span>📌 ${prodotto}</span>
            <button class="btn-del" onclick="rimuoviProdotto(${index})">Elimina</button>
          </div>
          <div class="offerte-list">
            ${htmlOfferte}
          </div>
        `;

        container.appendChild(card);
      });
    }
  </script>

</body>
</html>
