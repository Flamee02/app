<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Mia Spesa Smart</title>
  <!-- Widget Netlify Identity per gestione inviti e login -->
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 30px;
      padding-bottom: 30px;
      background-color: #08080c;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    .glow-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
      animation: float 12s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 100%);
      top: -50px;
      left: -80px;
    }

    .blob-2 {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, #8a2be2 0%, #4a00e0 100%);
      bottom: -80px;
      right: -80px;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(18, 18, 26, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      width: 92%;
      max-width: 400px;
    }

    /* Schermata di blocco per utenti non autenticati */
    #lockScreen {
      text-align: center;
      padding: 30px 10px;
    }

    #lockScreen h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    #lockScreen p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 25px;
    }

    .auth-btn {
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
    }

    /* Area riservata agli utenti loggati */
    #appContent {
      display: none;
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 22px;
      color: #ffffff;
      text-align: center;
    }

    /* Input & Autocompletamento */
    .input-wrapper {
      position: relative;
      margin-bottom: 15px;
    }

    .input-box {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
    }

    button.add-btn {
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    .suggestions-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 50px;
      background: rgba(24, 24, 35, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 10;
      margin-top: 5px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
    }

    .suggestion-item {
      padding: 10px 12px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .suggestion-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Filtri Rapidi */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.6);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: rgba(0, 210, 255, 0.2);
      border-color: #00d2ff;
      color: #00d2ff;
      font-weight: bold;
    }

    /* Gruppi di Liste */
    .group-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.4);
      margin: 15px 0 8px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    ul { list-style: none; padding: 0; margin: 0; }

    li {
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    li.completato { opacity: 0.35; }
    li.completato .item-header span { text-decoration: line-through; }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff4d4d;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .clear-btn {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background: rgba(255, 59, 48, 0.15);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.3);
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .offerte-container {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
    }

    .badge-offerta {
      display: block;
      margin-top: 3px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid #00d2ff;
      color: #e2e8f0;
    }

    .badge-offerta.Lidl { border-left-color: #facc15; background: rgba(250, 204, 21, 0.1); }
    .badge-offerta.Eurospin { border-left-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
  </style>
</head>
<body>

  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <div class="container">
    
    <!-- SCHERMATA DI BLOCCO -->
    <div id="lockScreen">
      🔒 <h2>Area Riservata</h2>
      <p>Questa applicazione è accessibile solo su invito.</p>
      <button class="auth-btn" onclick="openLogin()">Accedi con il tuo Invito</button>
    </div>

    <!-- CONTENUTO APP -->
    <div id="appContent">
      <div class="user-header">
        <span id="userEmail"></span>
        <button class="logout-btn" onclick="logout()">Esci</button>
      </div>

      <h1>🛒 Lista della Spesa</h1>

      <!-- Input con Autocompletamento -->
      <div class="input-wrapper">
        <div class="input-box">
          <input type="text" id="elementoInput" placeholder="Aggiungi o cerca prodotto..." oninput="gestisciSuggerimenti()">
          <button class="add-btn" onclick="aggiungiElemento()">+</button>
        </div>
        <div id="suggestionsBox" class="suggestions-box"></div>
      </div>

      <!-- Filtri Rapidi -->
      <div class="filter-bar">
        <button class="filter-btn active" onclick="setFiltro('tutti', this)">Tutti</button>
        <button class="filter-btn" onclick="setFiltro('da_comprare', this)">Da comprare</button>
        <button class="filter-btn" onclick="setFiltro('in_offerta', this)">In Offerta 🔥</button>
        <button class="filter-btn" onclick="setFiltro('comprati', this)">Comprati</button>
      </div>

      <!-- Contenitore Liste Raggruppate per Negozio -->
      <div id="listeContainer"></div>

      <button id="btnSvuota" class="clear-btn" onclick="svuotaLista()" style="display: none;">🗑️ Svuota Lista</button>
    </div>

  </div>

  <script>
    let elementi = JSON.parse(localStorage.getItem("spesa")) || [];
    let datiOfferte = [];
    let filtroAttivo = 'tutti';

    document.addEventListener("DOMContentLoaded", function() {
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => updateAuthUI(user));
        window.netlifyIdentity.on("login", user => { window.netlifyIdentity.close(); updateAuthUI(user); });
        window.netlifyIdentity.on("logout", () => updateAuthUI(null));
      }

      fetch('offerte.json')
        .then(res => res.json())
        .then(data => {
          datiOfferte = Object.values(data);
          mostraLista();
        })
        .catch(err => console.error("Errore caricamento offerte:", err));

      document.getElementById("elementoInput").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          nascondiSuggerimenti();
          aggiungiElemento();
        }
      });
    });

    function updateAuthUI(user) {
      const lockScreen = document.getElementById("lockScreen");
      const appContent = document.getElementById("appContent");
      const userEmail = document.getElementById("userEmail");

      if (user) {
        lockScreen.style.display = "none";
        appContent.style.display = "block";
        userEmail.innerText = user.email;
        mostraLista();
      } else {
        lockScreen.style.display = "block";
        appContent.style.display = "none";
      }
    }

    function openLogin() { if (window.netlifyIdentity) window.netlifyIdentity.open(); }
    function logout() { if (window.netlifyIdentity) window.netlifyIdentity.logout(); }

    function salvaInMemoria() { localStorage.setItem("spesa", JSON.stringify(elementi)); }

    /* Autocompletamento */
    function gestisciSuggerimenti() {
      const input = document.getElementById("elementoInput");
      const box = document.getElementById("suggestionsBox");
      const testo = input.value.toLowerCase().trim();

      if (testo.length < 2) {
        box.style.display = "none";
        return;
      }

      const trovati = datiOfferte.filter(off => (off.titolo || "").toLowerCase().includes(testo)).slice(0, 5);

      if (trovati.length === 0) {
        box.style.display = "none";
        return;
      }

      box.innerHTML = "";
      trovati.forEach(off => {
        const item = document.createElement("div");
        item.className = "suggestion-item";
        item.innerHTML = `<span><strong>${off.negozio}:</strong> ${off.titolo}</span> <span style="color:#4ade80">${off.prezzo}</span>`;
        item.onclick = function() {
          input.value = off.titolo;
          box.style.display = "none";
          aggiungiElemento();
        };
        box.appendChild(item);
      });
      box.style.display = "block";
    }

    function nascondiSuggerimenti() {
      setTimeout(() => { document.getElementById("suggestionsBox").style.display = "none"; }, 200);
    }

    /* Gestione Filtri */
    function setFiltro(tipo, btn) {
      filtroAttivo = tipo;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mostraLista();
    }

    /* Rendering e Raggruppamento per Negozio */
    function mostraLista() {
      const container = document.getElementById("listeContainer");
      const btnSvuota = document.getElementById("btnSvuota");
      if (!container) return;
      
      container.innerHTML = "";
      btnSvuota.style.display = elementi.length > 0 ? "block" : "none";

      // Filtra elementi
      let filtrati = elementi.map((item, index) => ({ ...item, originalIndex: index })).filter(item => {
        if (filtroAttivo === 'da_comprare') return !item.comprato;
        if (filtroAttivo === 'comprati') return item.comprato;
        if (filtroAttivo === 'in_offerta') {
          const t = item.testo.toLowerCase().trim();
          return datiOfferte.some(off => (off.titolo || "").toLowerCase().includes(t));
        }
        return true;
      });

      // Raggruppa per Negozio
      const gruppi = { 'Lidl': [], 'Eurospin': [], 'Altri Prodotti': [], 'Completati': [] };

      filtrati.forEach(item => {
        if (item.comprato) {
          gruppi['Completati'].push(item);
          return;
        }

        const parola = item.testo.toLowerCase().trim();
        const off = datiOfferte.find(o => (o.titolo || "").toLowerCase().includes(parola));

        if (off && gruppi[off.negozio]) {
          gruppi[off.negozio].push(item);
        } else {
          gruppi['Altri Prodotti'].push(item);
        }
      });

      // Genera HTML per ogni gruppo
      Object.keys(gruppi).forEach(nomeGruppo => {
        const listaGruppo = gruppi[nomeGruppo];
        if (listaGruppo.length === 0) return;

        const gruppoDiv = document.createElement("div");
        gruppoDiv.innerHTML = `<div class="group-title">${getIconaGruppo(nomeGruppo)} ${nomeGruppo}</div>`;
        const ul = document.createElement("ul");

        listaGruppo.forEach(item => {
          const li = document.createElement("li");
          if (item.comprato) li.classList.add("completato");

          li.onclick = function() {
            elementi[item.originalIndex].comprato = !elementi[item.originalIndex].comprato;
            salvaInMemoria();
            mostraLista();
          };

          const parola = item.testo.toLowerCase().trim();
          const trovate = datiOfferte.filter(off => (off.titolo || "").toLowerCase().includes(parola));

          let htmlOfferte = "";
          if (trovate.length > 0) {
            trovate.forEach(off => {
              htmlOfferte += `<div class="badge-offerta ${off.negozio}"><strong>📍 ${off.negozio}:</strong> ${off.titolo} — <span style="color: #4ade80; font-weight: bold;">${off.prezzo}</span></div>`;
            });
          }

          li.innerHTML = `
            <div class="item-header">
              <span>${item.testo}</span>
              <button class="delete-btn" onclick="eliminaElemento(event, ${item.originalIndex})">✕</button>
            </div>
            ${htmlOfferte ? `<div class="offerte-container">${htmlOfferte}</div>` : ''}
          `;
          ul.appendChild(li);
        });

        gruppoDiv.appendChild(ul);
        container.appendChild(gruppoDiv);
      });
    }

    function getIconaGruppo(nome) {
      if (nome === 'Lidl') return '🟡';
      if (nome === 'Eurospin') return '🔵';
      if (nome === 'Completati') return '✅';
      return '📦';
    }

    function aggiungiElemento() {
      const input = document.getElementById("elementoInput");
      const testo = input.value.trim();
      if (testo === "") return;

      elementi.push({ testo: testo, comprato: false });
      salvaInMemoria();
      mostraLista();
      input.value = "";
    }

    function eliminaElemento(event, index) {
      event.stopPropagation();
      elementi.splice(index, 1);
      salvaInMemoria();
      mostraLista();
    }

    function svuotaLista() {
      if (elementi.length === 0) return;
      if (confirm("Sei sicuro di voler cancellare tutta la lista?")) {
        elementi = [];
        salvaInMemoria();
        mostraLista();
      }
    }
  </script>

</body>
</html>
