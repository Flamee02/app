<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Mia Spesa Smart</title>
  <!-- Widget Netlify Identity per gestione inviti e login -->
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 50px;
      padding-bottom: 20px;
      background-color: #08080c;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    .glow-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
      animation: float 12s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 100%);
      top: -50px;
      left: -80px;
    }

    .blob-2 {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, #8a2be2 0%, #4a00e0 100%);
      bottom: -80px;
      right: -80px;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(18, 18, 26, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      width: 90%;
      max-width: 360px;
    }

    /* Schermata di blocco per utenti non autenticati */
    #lockScreen {
      text-align: center;
      padding: 20px 10px;
    }

    #lockScreen h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    #lockScreen p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
    }

    .auth-btn {
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
    }

    /* Area riservata agli utenti loggati */
    #appContent {
      display: none;
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
      color: #ffffff;
      text-align: center;
    }

    .input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 15px;
      color: #ffffff;
      outline: none;
    }

    button.add-btn {
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    ul { list-style: none; padding: 0; margin: 0; }

    li {
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    li.completato { opacity: 0.35; }
    li.completato .item-header span { text-decoration: line-through; }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff4d4d;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .clear-btn {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background: rgba(255, 59, 48, 0.15);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.3);
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .offerte-container {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
    }

    .badge-offerta {
      display: block;
      margin-top: 4px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid #00d2ff;
      color: #e2e8f0;
    }

    .badge-offerta.Lidl { border-left-color: #facc15; background: rgba(250, 204, 21, 0.1); }
    .badge-offerta.Eurospin { border-left-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
    .no-offerta { color: rgba(255, 255, 255, 0.35); font-style: italic; font-size: 11px; }
  </style>
</head>
<body>

  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <div class="container">
    
    <!-- SCHERMATA DI BLOCCO -->
    <div id="lockScreen">
      🔒 <h2>Area Riservata</h2>
      <p>Questa applicazione è accessibile solo su invito.</p>
      <button class="auth-btn" onclick="openLogin()">Accedi con il tuo Invito</button>
    </div>

    <!-- CONTENUTO APP (Visibile solo agli utenti invitati e autenticati) -->
    <div id="appContent">
      <div class="user-header">
        <span id="userEmail"></span>
        <button class="logout-btn" onclick="logout()">Esci</button>
      </div>

      <h1>🛒 Lista della Spesa</h1>
      
      <div class="input-box">
        <input type="text" id="elementoInput" placeholder="Aggiungi oggetto...">
        <button class="add-btn" onclick="aggiungiElemento()">+</button>
      </div>

      <ul id="listaSpesa"></ul>

      <button id="btnSvuota" class="clear-btn" onclick="svuotaLista()" style="display: none;">🗑️ Svuota Lista</button>
    </div>

  </div>

  <script>
    let elementi = JSON.parse(localStorage.getItem("spesa")) || [];
    let datiOfferte = [];

    document.addEventListener("DOMContentLoaded", function() {
      // Inizializza il widget Identity
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          updateAuthUI(user);
        });

        window.netlifyIdentity.on("login", user => {
          window.netlifyIdentity.close();
          updateAuthUI(user);
        });

        window.netlifyIdentity.on("logout", () => {
          updateAuthUI(null);
        });
      }

      fetch('offerte.json')
        .then(res => res.json())
        .then(data => {
          datiOfferte = Object.values(data);
          mostraLista();
        })
        .catch(err => console.error("Errore carimento offerte:", err));

      document.getElementById("elementoInput").addEventListener("keydown", function(event) {
        if (event.key === "Enter") aggiungiElemento();
      });
    });

    function updateAuthUI(user) {
      const lockScreen = document.getElementById("lockScreen");
      const appContent = document.getElementById("appContent");
      const userEmail = document.getElementById("userEmail");

      if (user) {
        lockScreen.style.display = "none";
        appContent.style.display = "block";
        userEmail.innerText = user.email;
        mostraLista();
      } else {
        lockScreen.style.display = "block";
        appContent.style.display = "none";
      }
    }

    function openLogin() {
      if (window.netlifyIdentity) {
        window.netlifyIdentity.open();
      }
    }

    function logout() {
      if (window.netlifyIdentity) {
        window.netlifyIdentity.logout();
      }
    }

    function salvaInMemoria() {
      localStorage.setItem("spesa", JSON.stringify(elementi));
    }

    function mostraLista() {
      const ul = document.getElementById("listaSpesa");
      const btnSvuota = document.getElementById("btnSvuota");
      if (!ul) return;
      
      ul.innerHTML = "";

      if (elementi.length > 0) {
        btnSvuota.style.display = "block";
      } else {
        btnSvuota.style.display = "none";
      }

      elementi.forEach((item, index) => {
        const li = document.createElement("li");
        if (item.comprato) li.classList.add("completato");

        li.onclick = function() {
          elementi[index].comprato = !elementi[index].comprato;
          salvaInMemoria();
          mostraLista();
        };

        const parolaCercata = item.testo.toLowerCase().trim();
        const trovate = datiOfferte.filter(off => {
          const titolo = (off.titolo || "").toLowerCase();
          return titolo.includes(parolaCercata);
        });

        let htmlOfferte = "";
        if (trovate.length > 0) {
          trovate.forEach(off => {
            htmlOfferte += `
              <div class="badge-offerta ${off.negozio}">
                <strong>📍 ${off.negozio}:</strong> ${off.titolo} — <span style="color: #4ade80; font-weight: bold;">${off.prezzo}</span>
              </div>
            `;
          });
        } else {
          htmlOfferte = `<div class="no-offerta">Nessuna offerta in volantino</div>`;
        }

        li.innerHTML = `
          <div class="item-header">
            <span>${item.testo}</span>
            <button class="delete-btn" onclick="eliminaElemento(event, ${index})">✕</button>
          </div>
          <div class="offerte-container">
            ${htmlOfferte}
          </div>
        `;

        ul.appendChild(li);
      });
    }

    function aggiungiElemento() {
      const input = document.getElementById("elementoInput");
      const testo = input.value.trim();
      if (testo === "") return;

      elementi.push({ testo: testo, comprato: false });
      salvaInMemoria();
      mostraLista();
      input.value = "";
    }

    function eliminaElemento(event, index) {
      event.stopPropagation();
      elementi.splice(index, 1);
      salvaInMemoria();
      mostraLista();
    }

    function svuotaLista() {
      if (elementi.length === 0) return;
      if (confirm("Sei sicuro di voler cancellare tutta la lista?")) {
        elementi = [];
        salvaInMemoria();
        mostraLista();
      }
    }
  </script>

</body>
</html>
